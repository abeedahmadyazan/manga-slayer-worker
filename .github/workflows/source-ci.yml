name: Verify and publish backend source
on:
  push:
    paths:
      - manga-slayer-worker-source.zip
      - .github/workflows/source-ci.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backend-source
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract source archive
        run: unzip -oq manga-slayer-worker-source.zip -d worker
      - name: Install dependencies
        working-directory: worker
        run: npm ci
      - name: Typecheck and verify behavior
        working-directory: worker
        run: npm run check && npm test
      - name: Publish browsable source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Worker source files'
            git push
          fi
